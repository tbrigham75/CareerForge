{% extends "base.html" %}
{% block content %}
<h1>Projects</h1>
<form action="/projects" method="post"><input type="hidden" name="csrf" value="{{ csrf_token }}"><div class="grid"><label>Project name<input name="name" required></label><label>Description<input name="description"></label></div><button>Create project</button></form>
<table><tr><th>Name</th><th>Status</th><th>Description</th><th>Linked accomplishments</th></tr>{% for project in projects %}<tr><td>{{ project.name }}</td><td>{{ project.status }}</td><td>{{ project.description }}</td><td>{{ project.accomplishments | length }}</td></tr>{% else %}<tr><td colspan="4">No projects created yet.</td></tr>{% endfor %}</table>
{% endblock %}
