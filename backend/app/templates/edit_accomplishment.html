{% extends "base.html" %}
{% block content %}
<p><a href="/accomplishments/{{ record.id }}">← Cancel editing</a></p><h1>Edit accomplishment</h1>
<p class="notice">The original raw note remains preserved. Saving creates an immutable revision.</p>
<form action="/accomplishments/{{ record.id }}/edit" method="post"><input type="hidden" name="csrf" value="{{ csrf_token }}"><div class="grid">
<label>Title<input name="title" value="{{ record.title }}" required></label><label>Status<select name="status">{% for value in ['raw_note', 'draft', 'in_progress', 'completed', 'archived'] %}<option value="{{ value }}" {% if record.status == value %}selected{% endif %}>{{ value }}</option>{% endfor %}</select></label>
<label>Approval<select name="approval_status">{% for value in ['draft', 'approved', 'rejected'] %}<option value="{{ value }}" {% if record.approval_status == value %}selected{% endif %}>{{ value }}</option>{% endfor %}</select></label><label>Sensitivity<select name="sensitivity">{% for value in ['public_safe', 'private_personal', 'internal', 'confidential', 'do_not_sync'] %}<option value="{{ value }}" {% if record.sensitivity == value %}selected{% endif %}>{{ value }}</option>{% endfor %}</select></label>
<label>Start date<input type="date" name="date_started" value="{{ record.date_started or '' }}"></label><label>Completion date<input type="date" name="date_completed" value="{{ record.date_completed or '' }}"></label>
<label class="wide">Original raw note<textarea name="raw_note">{{ record.raw_note }}</textarea></label><label class="wide">Action<textarea name="action">{{ record.action }}</textarea></label><label>Metric<textarea name="metric">{{ record.metric }}</textarea></label><label>Impact<textarea name="impact">{{ record.impact }}</textarea></label><label class="wide">Supporting narrative<textarea name="supporting_narrative">{{ record.supporting_narrative }}</textarea></label>
<label>Systems<input name="systems" value="{{ record.systems | join(', ') }}"></label><label>Technologies<input name="technologies" value="{{ record.technologies | join(', ') }}"></label><label>Tags<input name="tags" value="{{ record.tags | join(', ') }}"></label><label>Categories<input name="categories" value="{{ record.categories | join(', ') }}"></label><label><input type="checkbox" name="github_export" value="true" {% if record.github_export %}checked{% endif %}> Eligible for Markdown export</label></div><button>Save revision</button></form>
{% endblock %}
