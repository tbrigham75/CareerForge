<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}CareerForge{% endblock %}</title><link rel="stylesheet" href="/static/app.css"></head><body>
{% if user_id %}<header><a class="brand" href="/dashboard">CareerForge</a><nav><a href="/capture">I Did This</a><a href="/accomplishments">Accomplishments</a><a href="/projects">Projects</a><a href="/taxonomy">Taxonomy</a><a href="/reports">Reports</a><a href="/exports">Exports</a><a href="/imports">Imports</a><a href="/providers">AI Providers</a><a href="/audit">Audit Log</a><form class="inline" action="/logout" method="post"><input type="hidden" name="csrf" value="{{ csrf_token }}"><button class="secondary">Log out</button></form></nav></header>{% endif %}
<main>{% if error %}<p class="notice error">{{ error }}</p>{% endif %}{% if message %}<p class="notice">{{ message }}</p>{% endif %}{% block content %}{% endblock %}</main></body></html>
