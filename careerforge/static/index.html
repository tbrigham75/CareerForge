<!doctype html><html lang="en" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CareerForge</title><link rel="stylesheet" href="/assets/styles.css"></head><body><div id="boot">Opening CareerForge…</div><section id="auth" hidden><h1>CareerForge</h1><p id="auth-copy"></p><form id="setup-form" hidden><input name="username" placeholder="Username" required><input name="password" type="password" minlength="10" placeholder="Password (10+ characters)" required><button>Create workspace</button></form><form id="login-form" hidden><input name="username" placeholder="Username" required><input name="password" type="password" placeholder="Password" required><button>Sign in</button></form></section><div id="app" hidden><header><strong>CareerForge</strong><nav><button data-page="home">Home</button><button data-page="accomplishments">Accomplishments</button><button data-page="goals">Goals</button><button data-page="chat">Chat</button><button data-page="settings">Settings</button><button id="theme">Theme</button><button id="logout">Sign out</button></nav></header><main><div id="notice" hidden></div><section data-view="home"><h1>What did you get done?</h1><form id="capture-form"><textarea name="raw_note" required placeholder="Describe completed work"></textarea><input id="completed" name="date_completed" type="date"><select name="sensitivity"><option value="private_personal">Private / personal</option><option value="internal">Internal</option><option value="confidential">Confidential</option><option value="do_not_sync">Do not sync</option><option value="public_safe">Public-safe</option></select><button>Save accomplishment</button><button id="draft-ai" type="button">Draft with AI</button></form><div id="draft"></div></section><section data-view="accomplishments" hidden><h1>Accomplishments</h1><div id="records"></div></section><section data-view="goals" hidden><h1>Goals</h1><button id="suggest-goals">Suggest goals</button><div id="goal-suggestions"></div><form id="goal-form"><input name="title" placeholder="Goal" required><textarea name="details" placeholder="Details"></textarea><button>Save goal</button></form><div id="goals"></div></section><section data-view="chat" hidden><h1>Chat</h1><div id="chat-log"></div><form id="chat-form"><textarea name="message" required placeholder="Ask CareerForge AI"></textarea><button>Send</button></form></section><section data-view="settings" hidden><h1>Settings</h1><h2>AI / Ollama</h2><form id="provider-form"><input name="display_name" value="Local Ollama" required><select name="provider_class"><option value="local">Local</option><option value="remote">Remote</option></select><input name="base_url" placeholder="Base URL" required><input name="default_model" placeholder="Model name" required><input name="api_token" type="password" placeholder="Optional API token"><label><input name="is_default" type="checkbox" checked> Default provider</label><button>Save provider</button></form><div id="providers"></div><h2>Password</h2><form id="password-form"><input name="current_password" type="password" placeholder="Current password" required><input name="new_password" type="password" minlength="10" placeholder="New password" required><button>Update password</button></form></section></main></div><script src="/assets/app.js"></script></body></html>
