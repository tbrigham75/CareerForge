[project]
name = "careerforge"
version = "0.1.0"
description = "A local-first archive for documented professional impact."
requires-python = ">=3.13"
dependencies = [
  "alembic>=1.20,<2",
  "argon2-cffi>=25.1,<26",
  "fastapi>=0.141,<1",
  "itsdangerous>=2.2,<3",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.53,<1",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
dev = ["httpx>=0.28,<1", "pyinstaller>=6.19,<7", "pytest>=9.1,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
