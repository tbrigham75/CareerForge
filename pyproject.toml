[project]
name = "careerforge"
version = "0.1.0"
description = "A local-first accomplishment archive and report generator."
requires-python = ">=3.12,<3.14"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["backend", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008", "E501"]

[tool.mypy]
python_version = "3.13"
files = ["backend"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_return_any = false
